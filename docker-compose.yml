x-app-build: &app-build
  context: .
  target: production
  args:
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}

x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: 3000
  DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
  DB_POOL_MAX: 10
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-in-production}
  JWT_EXPIRES_IN: 1h
  INITIAL_WALLET_BALANCE: 10000000
  RECEIPT_THRESHOLD: 5000000
  RECEIPT_JOB_ATTEMPTS: 5
  RECEIPT_JOB_BACKOFF_MS: 2000
  WORKER_CONCURRENCY: 5
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: receipts
  MINIO_REGION: us-east-1
  MINIO_PUBLIC_URL: http://localhost:9000
  RECEIPT_URL_EXPIRY_SECONDS: 604800
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: Admin@12345
  ADMIN_FULL_NAME: System Administrator
  SEED_DEMO_USERS: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: *app-build
    command: ["node", "src/scripts/migrate.js"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: *app-build
    command: ["node", "src/server.js"]
    environment: *app-environment
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: *app-build
    command: ["node", "src/worker.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
